<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Code Reviewer</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #182230; background: #f4f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    main { width: min(920px, 100%); background: #fff; border: 1px solid #e3e9f1; border-radius: 18px; box-shadow: 0 18px 55px #22334a12; padding: clamp(22px, 4vw, 40px); }
    .eyebrow { color: #5268d8; font-size: 12px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(27px, 4vw, 36px); letter-spacing: -.04em; }
    .intro { color: #627083; line-height: 1.55; margin: 0 0 26px; }
    label { display: block; font-size: 14px; font-weight: 700; margin: 17px 0 8px; }
    input, textarea, select { width: 100%; border: 1px solid #d7dfeb; border-radius: 10px; padding: 12px 14px; color: #182230; background: #fff; font: inherit; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #6679ed; box-shadow: 0 0 0 3px #6679ed20; }
    input, select { font-size: 14px; }
    textarea { min-height: 260px; resize: vertical; font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size: 4; }
    .hint { color: #7b8797; font-size: 12px; margin: 7px 0 0; }
    .actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    button { border: 0; border-radius: 10px; background: #5268d8; color: white; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #4358c4; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { color: #687589; font-size: 13px; }
    .result { margin-top: 27px; border-top: 1px solid #e8edf3; padding-top: 20px; }
    .result h2 { font-size: 16px; margin: 0 0 10px; }
    #analysis { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; color: #2c3848; margin: 0; font: 14px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
    #analysis:empty { display: none; }
    #usage { color: #687589; font-size: 12px; margin: 10px 0 0; }
    @media (max-width: 560px) { body { padding: 12px; } main { border-radius: 13px; } .actions { align-items: flex-start; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Simple AI code review</div>
    <h1>Python Code Reviewer</h1>
    <p class="intro">Paste Python code to get a focused review for bugs, edge cases, and security issues. The code is analyzed as text and is never run.</p>

    <label for="api-url">Backend API URL</label>
    <input id="api-url" type="url" placeholder="https://your-backend.example.com" autocomplete="url">
    <p class="hint">Enter the deployed backend base URL. It should expose a <code>POST /review</code> endpoint.</p>

    <label for="model">OpenAI model</label>
    <select id="model">
      <option value="gpt-6-luna" selected>GPT-6 Luna — fastest, lowest cost</option>
      <option value="gpt-6.1-sol">GPT-6.1 Sol — balanced</option>
      <option value="gpt-6-astra">GPT-6 Astra — most capable</option>
    </select>

    <label for="code">Python code</label>
    <textarea id="code" spellcheck="false" placeholder="def divide(a, b):&#10;    return a / b"></textarea>

    <div class="actions">
      <button id="review" type="button">Review code</button>
      <button id="clear" type="button" style="background:#edf0f6;color:#344054">Clear</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>

    <section class="result" aria-live="polite">
      <h2>Analysis</h2>
      <pre id="analysis"></pre>
      <p id="usage"></p>
    </section>
  </main>
  <script>
    const apiUrlInput = document.querySelector("#api-url");
    const codeInput = document.querySelector("#code");
    const reviewButton = document.querySelector("#review");
    const status = document.querySelector("#status");
    const analysis = document.querySelector("#analysis");
    const usage = document.querySelector("#usage");
    apiUrlInput.value = localStorage.getItem("codeReviewerApiUrl") || "";

    apiUrlInput.addEventListener("change", () => {
      localStorage.setItem("codeReviewerApiUrl", apiUrlInput.value.trim());
    });

    reviewButton.addEventListener("click", async () => {
      const baseUrl = apiUrlInput.value.trim().replace(/\/+$/, "");
      const code = codeInput.value.trim();
      analysis.textContent = "";
      usage.textContent = "";
      if (!baseUrl) { status.textContent = "Enter the backend API URL first."; apiUrlInput.focus(); return; }
      if (!code) { status.textContent = "Paste some Python code first."; codeInput.focus(); return; }

      reviewButton.disabled = true;
      status.textContent = "Analyzing…";
      analysis.textContent = "Review in progress…";
      try {
        const response = await fetch(`${baseUrl}/review`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code, model: document.querySelector("#model").value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = typeof data.detail === "string" ? data.detail : `Request failed (${response.status}).`;
          throw new Error(detail);
        }
        analysis.textContent = data.analysis || "The backend returned no analysis text.";
        usage.textContent = `Tokens used — input: ${data.input_tokens ?? "?"}, output: ${data.output_tokens ?? "?"}, total: ${data.total_tokens ?? "?"}`;
        status.textContent = "Review complete";
      } catch (error) {
        analysis.textContent = "";
        status.textContent = `Could not complete review: ${error.message}`;
      } finally {
        reviewButton.disabled = false;
      }
    });

    document.querySelector("#clear").addEventListener("click", () => {
      codeInput.value = "";
      analysis.textContent = "";
      usage.textContent = "";
      status.textContent = "";
      codeInput.focus();
    });
  </script>
</body>
</html>
